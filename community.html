  <style id="responsive-product-refinement">
    * { scrollbar-width: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    .workspace {
      gap: 0;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.13);
      border-top-color: rgba(255,255,255,.19);
      border-radius: 18px;
      background: rgba(7,12,20,.46);
      backdrop-filter: blur(30px) saturate(116%);
      -webkit-backdrop-filter: blur(30px) saturate(116%);
      box-shadow: 0 18px 54px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(255,255,255,.025);
    }
    .workspace > .rail,
    .workspace > .conversation {
      border: 0;
      border-radius: 0;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
    }
    .workspace > .rail { border-right: 1px solid rgba(255,255,255,.10); }
    .workspace-name,
    .rail-search { display: none; }
    @media (min-width: 821px) and (max-width: 1024px) {
      .page { padding: 14px; }
      .workspace { grid-template-columns: 220px minmax(0,1fr); gap: 0; }
    }
    @media (max-width: 820px) {
      body { overflow-x: hidden; }
      .shell { min-height: 100dvh; height: 100dvh; }
      .topbar { gap: 10px; padding: 0 12px; }
      .search { max-width: none; }
      .page { padding: 10px; }
      .workspace { height: 100%; display: grid; grid-template-rows: 172px minmax(0, 1fr); gap: 0; border-radius: 16px; }
      .rail { display: block; max-height: 172px; padding: 10px; overflow-y: auto; }
      .workspace > .rail { border-right: 0; border-bottom: 1px solid rgba(255,255,255,.10); }
      .rail-nav { display: flex; gap: 4px; margin: 8px 0 0; overflow-x: auto; scrollbar-width: none; }
      .rail-nav::-webkit-scrollbar { display: none; }
      .rail-nav button { min-width: max-content; min-height: 40px; }
      .rail .label,
      .rail #directMessages { display: none; }
      .rail #publicGroups,
      .rail #privateGroups { display: flex; gap: 4px; margin-top: 5px; overflow-x: auto; scrollbar-width: none; }
      .rail #publicGroups::-webkit-scrollbar,
      .rail #privateGroups::-webkit-scrollbar { display: none; }
      .rail .channel { width: auto; min-width: max-content; min-height: 40px; }
      .conversation { height: 100%; min-height: 0; border-radius: 0; }
      .channel-head { min-height: 64px; padding: 0 12px; }
      .channel-title p { max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tabs { padding-inline: 10px; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tabs button { min-height: 40px; }
      .messages { padding: 4px 12px; }
      .message { padding: 11px 2px; }
      .composer { margin: 8px 10px 10px; }
      .composer-tools button,
      .icon-btn,
      .small-btn,
      .member-btn { min-width: 44px; min-height: 44px; }
      .composer textarea { min-height: 58px; }
    }
    @media (max-width: 520px) {
      .brand span:last-child,
      .top-actions .icon-btn:not(:last-child),
      .channel-actions .small-btn { display: none; }
      .topbar { grid-template-columns: auto 1fr auto; }
      .search input { height: 44px; }
      .channel-title p { max-width: 50vw; }
      .messages { padding-inline: 10px; }
      .message p { font-size: 13px; }
      .composer-bottom span { display: none; }
      .send { width: 44px; height: 44px; }
      .workspace { grid-template-rows: 148px minmax(0, 1fr); }
      .rail { max-height: 148px; }
      .rail-nav { display: none; }
    }
  </style>

<body>
<div class="shell" data-od-id="community-page"><header class="topbar" data-od-id="community-topbar"><div class="brand"><span class="brand-dot"></span><span>Profeshare AI</span></div><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="globalSearch" aria-label="Search community" placeholder="Search community" oninput="render()"></div><div class="top-actions"><button class="icon-btn" title="Go back" aria-label="Go back" onclick="history.back()">‹</button><button class="icon-btn" title="More options" aria-label="More options">•••</button></div></header><main class="page"><div class="workspace"><aside class="rail" id="communityConversations" data-od-id="community-conversation-rail"><button class="community-menu" aria-label="Close conversations" onclick="toggleCommunityRail(false)">×</button><div class="workspace-name"><span class="workspace-mark">P</span><span>Community</span><button aria-label="Community options">⌄</button></div><input id="railSearch" class="rail-search" aria-label="Find a conversation" placeholder="Find a conversation…" oninput="render()"><div class="rail-nav"><button onclick="setView('Threads')">◌ <span>Threads</span></button><button onclick="setView('Huddles')">◉ <span>Huddles</span></button><button onclick="setView('Drafts & sent')">✎ <span>Drafts & sent</span></button></div><div class="label"><span>Public groups</span><button aria-label="Add public group" onclick="notify('Create a public community group')">+</button></div><div id="publicGroups"></div><div class="label"><span>Private groups</span><button aria-label="Add private group" onclick="notify('Create a private community group')">+</button></div><div id="privateGroups"></div><div class="label"><span>Direct messages</span><button aria-label="Start direct message" onclick="notify('Start a direct message')">+</button></div><div id="directMessages"></div></aside><section class="conversation" data-od-id="community-channel"><header class="channel-head"><button class="community-menu" aria-label="Open conversations" aria-expanded="false" onclick="toggleCommunityRail(true)">☰</button><span id="channelAvatar" class="avatar blue">#</span><div class="channel-title"><h2 id="channelName"></h2><p id="channelDescription"></p></div><div class="channel-actions"><button class="member-btn" onclick="toggleMembers()">♧ <span id="memberCount">8</span></button><button class="small-btn" aria-label="Start huddle" onclick="notify('Start a huddle')">◉</button><button class="small-btn" aria-label="Search channel" onclick="document.getElementById('globalSearch').focus()">⌕</button><button class="small-btn" aria-label="More channel actions">•••</button></div><div id="members" class="members" hidden></div></header><nav class="tabs" aria-label="Community sections"><button class="active" data-view="Messages" onclick="setView('Messages')">Messages</button><button data-view="Add canvas" onclick="setView('Add canvas')">Add canvas</button><button data-view="Files & links" onclick="setView('Files & links')">Files & links</button><button data-view="Pins" onclick="setView('Pins')">Pins</button></nav><div id="messages" class="messages"></div><div id="composer" class="composer" data-od-id="community-composer"><div class="composer-tools"><button aria-label="Bold"><strong>B</strong></button><button aria-label="Italic"><em>I</em></button><button aria-label="Add link">↗</button><button aria-label="Mention">@</button><button aria-label="Add emoji">☺</button></div><textarea aria-label="Write a community message" id="composerInput" rows="2" placeholder="Write a message…" oninput="updateSend()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea><div class="composer-bottom"><span>Press Enter to send · Shift + Enter for a new line</span><button id="send" class="send" aria-label="Send message" onclick="sendMessage()">➤</button></div></div></section></div></main></div>
<script>
const channels=[{id:'product-design-team',name:'product-design-team',private:true,unread:3,description:'Design decisions, reviews, and handoffs'},{id:'ai-research',name:'ai-research',private:false,unread:0,description:'Papers, methods, and source reviews'},{id:'career-circle',name:'career-circle',private:true,unread:1,description:'Mentoring and opportunity sharing'}];const people=[{id:'sush',name:'Susheen',initials:'S',avatar:'rose',status:'online'},{id:'reesha',name:'Reesha',initials:'R',avatar:'green',status:'online'},{id:'akshay',name:'Akshay Padmashali',initials:'A',avatar:'blue',status:'away'},{id:'vishnu',name:'Vishnu Bhat',initials:'V',avatar:'violet',status:'offline'},{id:'musa',name:'Musa',initials:'M',avatar:'amber',status:'online'}];let messages=[{channel:'product-design-team',person:'Sam',initials:'S',avatar:'blue',time:'1:11 PM',text:'The task is approved — I added the latest <a class="link" href="#" onclick="event.preventDefault()">ClickUp handoff</a> for everyone to review.',replies:2,reaction:'👍 1'},{channel:'product-design-team',person:'Susheen',initials:'S',avatar:'rose',time:'11:32 AM',text:'<span class="mention">@here</span> standup?',replies:0,reaction:''},{channel:'product-design-team',person:'Sam',initials:'S',avatar:'blue',time:'5:14 PM',text:'Hey <span class="mention">@Musa</span> created the first design draft. Please check the streaming execution visibility notes and add feedback before review.',replies:1,reaction:'✅ 2'},{channel:'ai-research',person:'Reesha',initials:'R',avatar:'green',time:'10:20 AM',text:'I saved the NIST AI RMF section on mapping trustworthiness considerations to product decisions.',replies:3,reaction:'📌 1'},{channel:'career-circle',person:'Akshay',initials:'A',avatar:'blue',time:'Yesterday',text:'Sharing a role brief for a frontend engineer who can own accessible interaction patterns and design system handoff.',replies:2,reaction:''},{channel:'dm-akshay',person:'Akshay Padmashali',initials:'A',avatar:'blue',time:'9:42 AM',text:'I reviewed the role brief. The accessibility requirements look good — I can share a frontend systems checklist this afternoon.',replies:0,reaction:'👍 1'},{channel:'dm-reesha',person:'Reesha',initials:'R',avatar:'green',time:'Yesterday',text:'I added two papers to the shared research context. Let me know if the evidence trail is clear enough for the first review.',replies:1,reaction:''},{channel:'dm-sush',person:'Susheen',initials:'S',avatar:'rose',time:'Monday',text:'Can we review the product-design-team handoff after standup?',replies:0,reaction:''}];let state={channel:'product-design-team',view:'Messages',members:false};const current=()=>state.channel.startsWith('dm-')?{id:state.channel,name:(people.find(p=>`dm-${p.id}`===state.channel)||{}).name||'Direct message',private:true,description:'Direct message'}:channels.find(c=>c.id===state.channel)||channels[0];function notify(text){const i=document.getElementById('composerInput');i.value=text;updateSend();i.focus()}function setChannel(id){state.channel=id;state.view='Messages';state.members=false;render()}function setView(view){state.view=view;render()}function toggleMembers(){state.members=!state.members;render()}function updateSend(){document.getElementById('send').classList.toggle('ready',!!document.getElementById('composerInput').value.trim())}function sendMessage(){const i=document.getElementById('composerInput'),text=i.value.trim();if(!text)return;messages.push({channel:state.channel,person:'Sam',initials:'S',avatar:'blue',time:'Just now',text:text.replaceAll('<','&lt;'),replies:0,reaction:''});i.value='';updateSend();render()}function row(c){return `<button class="channel ${state.channel===c.id?'active':''}" onclick="setChannel('${c.id}')"><span class="channel-icon">${c.private?'⌑':'#'}</span><span>${c.name}</span>${c.unread?`<span class="badge">${c.unread}</span>`:''}</button>`}function render(){const q=(document.getElementById('globalSearch').value||document.getElementById('railSearch').value||'').toLowerCase(),match=x=>!q||JSON.stringify(x).toLowerCase().includes(q),c=current();document.getElementById('publicGroups').innerHTML=channels.filter(x=>!x.private&&match(x)).map(row).join('');document.getElementById('privateGroups').innerHTML=channels.filter(x=>x.private&&match(x)).map(row).join('');document.getElementById('directMessages').innerHTML=people.filter(match).map(p=>`<button class="person ${state.channel===`dm-${p.id}`?'active':''}" onclick="setChannel('dm-${p.id}')"><span class="avatar small ${p.avatar}">${p.initials}</span><span>${p.name}</span><span class="person-status" style="background:${p.status==='online'?'#66d6a1':p.status==='away'?'#f2bd72':'#756f6c'}"></span></button>`).join('')||'<div class="empty"><span>No conversations found.</span></div>';document.getElementById('channelAvatar').className=`avatar ${c.private?'violet':'blue'}`;document.getElementById('channelAvatar').textContent=c.private?'⌑':'#';document.getElementById('channelName').textContent=c.name;document.getElementById('channelDescription').textContent=c.description;document.getElementById('memberCount').textContent=people.length+3;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));const box=document.getElementById('members');box.hidden=!state.members;box.innerHTML=`<strong>Members · ${people.length+3}</strong>${people.slice(0,4).map(p=>`<div class="member-row"><span class="avatar small ${p.avatar}">${p.initials}</span><span>${p.name}</span><span>${p.status}</span></div>`).join('')}`;const list=messages.filter(m=>m.channel===c.id&&(!q||`${m.person} ${m.text}`.toLowerCase().includes(q))),root=document.getElementById('messages');if(state.view!=='Messages'){root.innerHTML=`<div class="empty"><div><strong>${state.view}</strong><span>Shared ${state.view.toLowerCase()} for ${c.name} will appear here.</span></div></div>`;document.getElementById('composer').style.display='none';return}document.getElementById('composer').style.display='block';root.innerHTML=list.length?`<div class="date">Today</div>${list.map(m=>`<article class="message"><span class="avatar ${m.avatar}">${m.initials}</span><div class="message-body"><div class="meta"><strong>${m.person}</strong><time>${m.time}</time></div><p>${m.text}</p><div class="tools">${m.reaction?`<button class="reaction" onclick="notify('React to ${m.person}’s message')">${m.reaction}</button>`:''}${m.replies?`<button class="thread" onclick="notify('Open ${m.replies} replies from ${m.person}')">${m.replies} ${m.replies===1?'reply':'replies'} · View thread</button>`:''}</div></div></article>`).join('')}`:'<div class="empty"><div><strong>No messages match this search</strong><span>Start the conversation with the composer below.</span></div></div>'}render();
</script>
<script>
/* Interaction polish: filters, message actions, thread panel, and lightweight realtime cues. */
const communityBaseRender=render;
function communityToast(message){let toast=document.getElementById('communityToast');if(!toast){toast=document.createElement('div');toast.id='communityToast';toast.className='toast';toast.setAttribute('role','status');document.body.appendChild(toast)}toast.textContent=message;toast.classList.add('show');clearTimeout(window.__communityToast);window.__communityToast=setTimeout(()=>toast.classList.remove('show'),2200)}
function notify(text){const i=document.getElementById('composerInput');i.value=text;updateSend();i.focus();communityToast('Draft added to the composer')}
function openThread(person,replies,text){const panel=document.getElementById('threadPanel');if(!panel)return;panel.classList.add('open');panel.setAttribute('aria-hidden','false');panel.querySelector('[data-thread-title]').textContent=`${replies} ${replies===1?'reply':'replies'} · ${person}`;panel.querySelector('[data-thread-body]').innerHTML=`<div class="thread-message"><strong>${person}</strong><p>${text}</p></div><div class="thread-replies"><div class="thread-reply"><span class="avatar small rose">R</span><span>That direction works. I’ll add the supporting notes before the next review.</span></div><div class="thread-reply"><span class="avatar small green">A</span><span>Added this to the shared context so the whole group can follow along.</span></div></div>`}
function closeThread(){const panel=document.getElementById('threadPanel');if(panel){panel.classList.remove('open');panel.setAttribute('aria-hidden','true')}}
function setRailFilter(filter){state.railFilter=filter;document.querySelectorAll('.rail-switcher button').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));render()}
const originalRow=row;row=function(c){return `<button class="channel ${state.channel===c.id?'active':''}" onclick="setChannel('${c.id}')"><span class="channel-icon">${c.private?'⌑':'#'}</span><span>${c.name}</span>${c.unread?`<span class="badge">${c.unread}</span><span class="channel-unread" aria-label="Unread messages"></span>`:''}</button>`}
const originalRender=render;render=function(){originalRender();const filter=state.railFilter||'all';document.querySelectorAll('#publicGroups .channel,#privateGroups .channel').forEach(el=>el.hidden=filter==='people'||(filter==='unread'&&!el.querySelector('.badge')));document.querySelectorAll('#directMessages .person').forEach(el=>el.hidden=filter==='groups'||filter==='unread');document.querySelectorAll('#messages .message').forEach(article=>{if(article.querySelector('.message-actions'))return;const meta=article.querySelector('.meta strong')?.textContent||'Message';const text=article.querySelector('.message-body p')?.textContent||'';const thread=article.querySelector('.thread');const actions=document.createElement('div');actions.className='message-actions';actions.innerHTML=`<button aria-label="React to ${meta}" onclick="notify('React to ${meta}’s message')">♡</button><button aria-label="Reply to ${meta}" onclick="openThread('${meta}',${thread?Number(thread.textContent):2},'${text.replaceAll("'","\\'")}')">↩</button><button aria-label="More message actions" onclick="communityToast('Message actions are ready')">•••</button>`;article.appendChild(actions);});};
document.addEventListener('DOMContentLoaded',()=>{
  const search=document.getElementById('railSearch');if(search){search.insertAdjacentHTML('afterend','<div class="rail-switcher" role="tablist" aria-label="Conversation filter"><button class="active" data-filter="all" onclick="setRailFilter(\'all\')">All</button><button data-filter="unread" onclick="setRailFilter(\'unread\')">Unread</button><button data-filter="people" onclick="setRailFilter(\'people\')">People</button></div><div class="rail-actions"><button class="rail-action" onclick="communityToast(\'New conversation flow ready\')">＋ New</button><button class="rail-action" onclick="communityToast(\'Invite link copied\')">Invite</button></div>')}
  const conversation=document.querySelector('.conversation');if(conversation){conversation.insertAdjacentHTML('beforeend','<aside id="threadPanel" class="thread-panel" aria-hidden="true"><header><strong data-thread-title>Thread</strong><button class="small-btn" aria-label="Close thread" onclick="closeThread()">×</button></header><div class="thread-body" data-thread-body></div><div class="composer" style="margin:12px"><textarea rows="2" placeholder="Reply in thread…" aria-label="Reply in thread"></textarea><div class="composer-bottom"><span>Replies stay with this conversation</span><button class="send ready" aria-label="Send thread reply" onclick="communityToast(\'Thread reply sent\')">➤</button></div></div></aside>')}
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeThread();const m=document.getElementById('members');if(m){m.hidden=true;state.members=false}}if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('globalSearch')?.focus()}});
</script>
<script>
  const communityBrand = document.querySelector('.brand');
  if (communityBrand) communityBrand.innerHTML = '<img class="brand-logo" src="Profeshare-AI-Logo.svg" alt="Profeshare AI">';
</script>
<script src="scripts/v170-accessibility.js"></script>
<script>
function toggleCommunityRail(open){document.querySelector('.workspace').classList.toggle('rail-open',open);const trigger=document.querySelector('.channel-head .community-menu');trigger.setAttribute('aria-expanded',String(open));if(open)document.getElementById('railSearch').focus();else trigger.focus()}
document.addEventListener('keydown',event=>{if(event.key==='Escape')toggleCommunityRail(false)});
document.querySelector('.rail').addEventListener('click',event=>{if(event.target.closest('.channel,.person')&&innerWidth<=820)toggleCommunityRail(false)});
document.querySelectorAll('.composer-tools button').forEach((button,index)=>button.addEventListener('click',()=>{const input=document.getElementById('composerInput');const tokens=['**','_','https://','@',':)'];input.setRangeText(tokens[index],input.selectionStart,input.selectionEnd,'end');input.focus();updateSend()}));
</script>
</body>
