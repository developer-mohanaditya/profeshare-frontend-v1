<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profeshare AI Copilot</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #171717;
      --fg: #fff3f0;
      --muted: #7a7a7a;
      --border: #ffffff;
      --accent: #fff3f0;
      --font-display: 'Inter', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'SF Mono', ui-monospace, monospace;
      --text-primary: var(--fg);
      --text-secondary: var(--muted);
      --accent-1: var(--accent);
      --accent-2: var(--accent);
      --fora-shadow-overlay: 0 1px 32px rgba(0, 0, 0, 0.35);
      --fora-shadow-card: 0 4px 10px rgba(0, 0, 0, 0.05);
      --fora-shadow-inset: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      --fora-radius-sm: 15px;
      --fora-radius-md: 16px;
      --fora-radius-lg: 24px;
      --fora-radius-pill: 100px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      color: var(--text-primary);
      background-color: var(--bg);
      overflow: hidden; 
      -webkit-font-smoothing: antialiased;
      color-scheme: dark;
    }

    .font-display {
      font-family: var(--font-display);
    }

    .text-gradient {
      background: var(--accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .bg-gradient-accent {
      background: var(--accent);
    }

    .glass {
      background: rgba(15, 23, 42, 0.46);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.16);
      border-top-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 0 7.7px rgba(255, 255, 255, 0.10);
    }
    
    .sidebar-glass {
      background: rgba(2, 8, 23, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid rgba(226, 232, 240, 0.16);
    }

    .input-glass {
      background: rgba(15, 23, 42, 0.64);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.2);
      border-top-color: rgba(255, 255, 255, 0.32);
      box-shadow: 0 0 7.7px rgba(255, 255, 255, 0.16);
    }

    /* Hybrid chat input container — tall rounded box with top-aligned text
       and a bottom row of controls (left: +, right: model/voice/submit).
       672 × 124 px, 24 px radius. Input area sits above; controls sit below. */
    .chat-input-box {
      width: 672px;
      max-width: 100%;
      min-height: 124px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      padding: 20px 20px 12px;
      gap: 12px;
    }
    .chat-input-box .chat-input-field {
      flex: 1;
      min-height: 44px;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: #fff;
      font-family: var(--font-body, Inter, system-ui, sans-serif);
      font-size: 1rem;
      line-height: 1.5;
      font-weight: 300;
    }
    .chat-input-box .chat-input-field:focus-visible { outline: none; }
    .chat-input-box .chat-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }
    .chat-input-box .chat-controls-left,
    .chat-input-box .chat-controls-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .chat-input-box .ctrl-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.78);
      transition: background var(--motion-fast, 150ms) cubic-bezier(0.2, 0, 0, 1), border-color var(--motion-fast, 150ms) cubic-bezier(0.2, 0, 0, 1), color var(--motion-fast, 150ms) cubic-bezier(0.2, 0, 0, 1);
      flex-shrink: 0;
    }
    .chat-input-box .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: transparent;
      color: #fff;
    }
    .chat-input-box .ctrl-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.24);
    }
    .chat-input-box .ctrl-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .chat-input-box .submit-btn {
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #0f172a;
      border: none;
      transition: transform var(--motion-fast, 150ms) cubic-bezier(0.2, 0, 0, 1), opacity var(--motion-fast, 150ms) cubic-bezier(0.2, 0, 0, 1);
      flex-shrink: 0;
    }
    .chat-input-box .submit-btn:hover { transform: translateY(-1px); }
    .chat-input-box .submit-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.32); }
    .chat-input-box .submit-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    /* Empty state + rotating placeholder reuse the same field. Dimmed hint
       sits top-aligned on the left edge of the input area. */
    .chat-input-box .rotating-placeholder {
      position: absolute;
      inset: 20px 20px auto 20px;
      pointer-events: none;
      overflow: hidden;
      height: 1.5em;
    }
    .chat-input-box .rotating-placeholder__span {
      position: absolute;
      inset: 0;
      top: 0;
      bottom: auto;
      display: flex;
      align-items: center;
      color: rgba(154, 154, 166, 0.45);
      font-size: 1rem;
      font-weight: 300;
      animation: rotph-fade 0.4s cubic-bezier(0.2, 0, 0, 1) forwards;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 720px) {
      .chat-input-box { width: 100%; min-height: 132px; padding: 16px 16px 10px; }
      .chat-input-box .chat-controls { gap: 10px; }
      .chat-input-box .chat-controls-left,
      .chat-input-box .chat-controls-right { gap: 10px; }
    }

    .glass-card {
      border-radius: 16px;
    }

    .glass-pill {
      border-radius: 9999px;
    }

    .glass-interactive {
      transition: background var(--motion-base, 240ms) cubic-bezier(0.2, 0, 0, 1), border-color var(--motion-fast, 150ms) cubic-bezier(0.2, 0, 0, 1), transform var(--motion-fast, 150ms) cubic-bezier(0.2, 0, 0, 1);
    }
    
    .glass-interactive:hover {
      background: rgba(15, 23, 42, 0.68);
      border-color: rgba(255, 255, 255, 0.38);
      box-shadow: 0 0 7.7px rgba(255, 255, 255, 0.29);
      transform: translateY(-2px);
    }

    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 8, 23, 0.82);
      z-index: -1;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    ::placeholder {
      color: rgba(154, 154, 166, 0.45);
      transition: color 0.4s ease;
    }

    /* Rotating category placeholder overlay.
       - One span per rotation; React swaps content via `key={placeholderIndex}` so the span remounts and re-runs the fade-in @keyframes.
       - The crossfade animates BETWEEN 0 (hidden) and 0.45 (resting) — never to 1 — so the resting state stays the brightest the hint ever gets.
       - Typed user text stays full-opacity because the overlay renders only when the field is empty (`pointer-events: none` lets clicks fall through to the input). */
    .rotating-placeholder {
      position: absolute;
      inset: 0;
      padding: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .rotating-placeholder__span {
      position: absolute;
      inset-inline: 1.5rem;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      color: rgba(154, 154, 166, 0.45);
      font-size: 1.125rem;
      font-weight: 300;
      animation: rotph-fade 0.4s cubic-bezier(0.2, 0, 0, 1) forwards;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @keyframes rotph-fade {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 0.45; transform: translateY(0); }
    }
    @media (max-width: 640px) {
      .rotating-placeholder__span { font-size: 1rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rotating-placeholder__span { animation: rotph-fade-reduced 0.3s ease forwards; }
      @keyframes rotph-fade-reduced {
        from { opacity: 0; }
        to   { opacity: 0.45; }
      }
    }

    .prompt-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .prompt-suggestions {
      width: 100%;
      max-width: 404px;
      margin-inline: auto;
    }

    .prompt-option-panel {
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 20px;
      background: rgba(13, 15, 18, 0.42);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(32px) saturate(112%);
      -webkit-backdrop-filter: blur(32px) saturate(112%);
    }

    .prompt-option-row {
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      padding: 8px 14px;
      border: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.13);
      color: var(--fg);
      text-align: left;
      background: transparent;
      cursor: pointer;
      transition:
        color 150ms cubic-bezier(0.2, 0, 0, 1),
        background 150ms cubic-bezier(0.2, 0, 0, 1);
    }

    .prompt-option-row:last-child {
      border-bottom: 0;
    }

    .prompt-option-row:hover,
    .prompt-option-row:focus-visible {
      color: var(--fg);
      background: rgba(255, 255, 255, 0.07);
    }

    .prompt-option-row:focus-visible {
      position: relative;
      z-index: 1;
      outline: 3px solid rgba(255, 243, 240, 0.80);
      outline-offset: -3px;
    }

    .prompt-option-copy {
      min-width: 0;
      display: block;
    }

    .prompt-option-text {
      color: rgba(255, 243, 240, 0.88);
      font-size: 10px;
      line-height: 1.4;
      letter-spacing: 0;
    }

    .home-empty-state {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 896px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-inline: auto;
      padding: 24px 48px;
      overflow-y: auto;
    }

    .home-background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url("image.png") center center / cover no-repeat;
    }

    .home-background::after {
      content: none;
      position: absolute;
      inset: 0;
      background: none;
      pointer-events: none;
    }

    .app-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url("image.png") center center / cover no-repeat;
      pointer-events: none;
    }

    .app-background::after {
      content: none;
      position: absolute;
      inset: 0;
      background: none;
    }

    .home-primary-stack {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(-2vh);
    }

    .home-greeting {
      margin: 0 0 28px;
      color: rgba(255, 250, 246, 0.96);
      font-size: clamp(38px, 3.2vw, 52px);
      line-height: 1.05;
      text-align: center;
      text-shadow: 0 3px 24px rgba(0, 0, 0, 0.52);
    }

    .home-chat-wrap {
      width: 100%;
      max-width: 672px;
      display: flex;
      justify-content: center;
    }

    .home-empty-state .prompt-suggestions {
      position: static;
      margin: 28px 0 0;
      transform: none;
    }

    .home-empty-state .chat-input-box {
      border-color: rgba(255, 255, 255, 0.24);
      background: rgba(13, 15, 18, 0.56);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.30);
      backdrop-filter: blur(32px) saturate(112%);
      -webkit-backdrop-filter: blur(32px) saturate(112%);
    }

    .home-empty-state .prompt-option-panel {
      background: rgba(13, 15, 18, 0.56);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.28);
    }

    @media (max-width: 520px) {
      .prompt-suggestions { max-width: 100%; }
      .prompt-option-row {
        min-height: 42px;
        padding: 7px 12px;
      }
      .prompt-option-text { font-size: 10px; }
      .home-empty-state { padding: 24px 16px; }
      .home-primary-stack { width: 100%; transform: translateY(0); }
      .home-greeting { margin-bottom: 22px; }
      .home-empty-state .prompt-suggestions {
        width: calc(100% - 32px);
        margin-top: 22px;
      }
    }

    @media (max-height: 760px) and (min-width: 521px) {
      .home-empty-state { padding-block: 16px; }
      .home-greeting { margin-bottom: 20px; }
      .home-empty-state .prompt-suggestions { margin-top: 20px; }
      .prompt-option-row { min-height: 40px; padding-block: 6px; }
    }

    @media (max-width: 640px) {
      .prompt-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 420px) {
      .prompt-grid {
        grid-template-columns: 1fr;
      }
    }

    .prompt-card {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      min-height: 44px;
      cursor: pointer;
      text-align: center;
      font-size: 11px;
      line-height: 1.35;
      letter-spacing: 0.01em;
    }

    .prompt-grid-mixed {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      width: 100%;
    }

    .prompt-card-with-label {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(16px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    .text-transparent.bg-clip-text { color: var(--fg) !important; -webkit-text-fill-color: var(--fg) !important; background: none !important; }
    .bg-gradient-accent { background: var(--accent) !important; }
    button:focus-visible, [role="button"]:focus-visible { outline: 3px solid rgba(255, 255, 255, 0.8) !important; outline-offset: 2px; }

    .status-pipeline {
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
    }

    .pipeline-step {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      position: relative;
    }

    .pipeline-step .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .pipeline-step .step-dot.completed {
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255,255,255,0.4);
    }

    .pipeline-step .step-dot.active {
      background: rgba(255,255,255,0.5);
      border: 2px solid rgba(255,255,255,0.8);
    }

    .pipeline-step .step-dot.pending {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .pipeline-step .step-label {
      font-size: 9px;
      white-space: nowrap;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .pipeline-step .step-label.completed {
      color: rgba(255,255,255,0.8);
    }

    .pipeline-connector {
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
      min-width: 8px;
    }

    .pipeline-connector.completed {
      background: rgba(255,255,255,0.35);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      transition: all 0.2s ease;
    }

    .tag:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--fg);
    }

    .profile-section {
      animation: slideInRight 0.4s ease-out;
    }

    .profile-section + .profile-section {
      margin-top: 24px;
    }

    .timeline-line {
      position: absolute;
      left: 11px;
      top: 20px;
      bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.08);
    }

    .sidebar-section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    /* Calendar workspace */
    .calendar-page {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 28px;
      background: var(--bg);
    }

    .calendar-shell {
      width: min(1520px, 100%);
      margin: 0 auto;
    }

    .calendar-unified {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      background: rgba(15, 23, 42, 0.68);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.1), 0 28px 70px rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .calendar-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin: 0;
      padding: 24px 24px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    }

    .calendar-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(36px, 4vw, 54px);
      line-height: 0.98;
      letter-spacing: -0.025em;
      font-weight: 400;
    }

    .calendar-subtitle {
      max-width: 62ch;
      margin: 10px 0 0;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      line-height: 1.55;
    }

    .calendar-primary {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 18px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 12px;
      color: var(--bg);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24), inset 0 1px rgba(255, 255, 255, 0.9);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: transform 150ms cubic-bezier(0.2, 0, 0, 1), background 150ms cubic-bezier(0.2, 0, 0, 1);
    }

    .calendar-primary:hover { background: #fff; transform: translateY(-1px); }
    .calendar-primary:active { transform: translateY(1px); }
    .calendar-primary:focus-visible,
    .calendar-control:focus-visible,
    .calendar-view-button:focus-visible,
    .calendar-event:focus-visible,
    .agenda-item:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.24);
    }

    .calendar-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px;
      margin: 0;
      border: 0;
      border-radius: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(2, 8, 23, 0.12);
      box-shadow: none;
    }

    .calendar-toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .calendar-control {
      min-width: 40px;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.82);
      background: rgba(255, 255, 255, 0.045);
      font-size: 12px;
      letter-spacing: 0.01em;
      transition: background 150ms cubic-bezier(0.2, 0, 0, 1), border-color 150ms cubic-bezier(0.2, 0, 0, 1);
    }

    .calendar-control:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .calendar-date-label {
      min-width: 190px;
      margin: 0 6px;
      text-align: center;
      font-family: var(--font-display);

    .timeline-canvas {

      margin-left: 64px;

    .timeline-hour {

      left: 0;
      height: 64px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);

    .timeline-hour span {

    .timeline-now-line {

    .timeline-now-line::before {

.ps-tools button:disabled { opacity:.45;cursor:wait; }
.ps-health,.ps-confirm { font-size:11px; line-height:1.5; overflow-wrap:anywhere; }
.ps-editor { padding:12px; border:1px solid var(--border); border-radius:var(--fora-radius-sm); }
.ps-editor textarea { margin:8px 0; padding:8px; border:1px solid var(--border)!important; border-radius:8px; max-height:180px; }
.ps-editor textarea:focus-visible { outline:2px solid var(--fg)!important;outline-offset:2px; }
.ps-response { min-width:0; color:var(--fg); overflow-wrap:anywhere; }
.ps-response h3 { margin:16px 0 8px; font-weight:600; font-size:17px; }
.ps-response ul { list-style:disc; padding-left:22px; }
.ps-markdown p { white-space:pre-wrap; }
.ps-markdown pre { white-space:pre-wrap; font-family:var(--font-mono); }
.ps-markdown a { color:inherit; text-decoration:underline; }
.ps-score { display:flex; flex-wrap:wrap; align-items:center; gap:20px; }
.ps-score strong { font-size:48px; line-height:1.2; }
.ps-score small {font-size:17px;}
.ps-dimension { margin:12px 0; }
.ps-dimension label { display:flex; justify-content:space-between; gap:12px; text-transform:capitalize; }
.ps-response progress { width:100%; height:10px; accent-color:var(--fg); }
.ps-response progress::-webkit-progress-bar { background:color-mix(in oklch,var(--fg) 15%,transparent); border-radius:8px; }
.ps-response progress::-webkit-progress-value { background:var(--fg);border-radius:8px; }
.ps-response progress::-moz-progress-bar { background:var(--fg); }
.ps-error { border:1px solid var(--border); padding:12px; border-radius:var(--fora-radius-sm); }
.ps-response summary { cursor:pointer; min-height:44px; padding-top:12px; }
.home-primary-stack { max-height:100%;overflow-y:auto; }
/* Let the expanded context controls reserve their own space above the message list. */
.results-chat-dock { position:relative; inset:auto; flex-shrink:0; max-height:60dvh; overflow-y:auto; }
.results-message-scroll { padding-bottom:24px !important; }
.ps-health { justify-self:start; padding:3px 8px; border:1px solid var(--border); border-radius:var(--fora-radius-pill); }
.ps-conversation-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:11px; color:var(--fg); }
.ps-conversation-hint { max-width:65ch; margin-top:16px; text-align:center; }
.chat-input-box .chat-input-field:focus-visible { outline:2px solid var(--fg) !important; outline-offset:5px; }
.ps-response .ps-response { margin-top:16px; }
</style>

    const PipelineVis = ({ stages }) => {
      const lastCompleted = stages.reduce((last, s, i) => s.completed ? i : last, -1);
      return (
        <div className="flex items-center w-full">
          {stages.map((s, i) => (
            <React.Fragment key={s.stage}>
              <div className="flex flex-col items-center gap-1.5" style={{ flex: i === 0 || i === stages.length - 1 ? '0 0 auto' : '1' }}>
                <div className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${s.completed ? 'bg-white shadow-[0_0_6px_rgba(255,255,255,0.4)]' : !s.completed && i === lastCompleted + 1 ? 'bg-white/50 border-2 border-white/80' : 'bg-white/12 border border-white/15'}`} />
                <span className={`text-[8px] whitespace-nowrap tracking-[0.04em] uppercase ${s.completed ? 'text-white/80' : 'text-white'}`}>{s.stage}</span>
              </div>
              {i < stages.length - 1 && (
                <div className={`h-px flex-1 min-w-[6px] ${s.completed ? 'bg-white/35' : 'bg-white/10'}`} />
              )}
            </React.Fragment>
          ))}
        </div>
      );
    };

    const JobTimelineModal = ({ job, onClose }) => {
      useEffect(() => {
        if (!job) return undefined;
        const handleEscape = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', handleEscape);
        return () => window.removeEventListener('keydown', handleEscape);
      }, [job, onClose]);

      if (!job) return null;
      const completedCount = job.stages.filter(s => s.completed).length;
      const currentStage = [...job.stages].reverse().find(stage => stage.completed) || job.stages[0];
      const nextStage = job.stages.find(stage => !stage.completed);
      return (
        <div className="fixed inset-0 z-[70] flex items-center justify-center p-3 sm:p-6 animate-[fadeIn_0.2s_ease-out]" role="dialog" aria-modal="true">
          <div className="details-overlay" onClick={onClose}></div>

                <div className="details-context-card"><dt>Next step</dt><dd>{nextStage ? nextStage.stage : 'Process complete'}</dd></div>
                <div className="details-context-card"><dt>Progress</dt><dd>{completedCount} of {job.stages.length} stages completed</dd></div>

              <div className="flex items-center justify-between mb-6">
                <span className="text-xs uppercase tracking-[0.1em] text-white">Application timeline</span>

              <div className="relative">
                <div className="absolute left-[11px] top-2 bottom-2 w-px bg-white/10"></div>

                    <div key={i} className="relative flex gap-4 pb-6 last:pb-0">
                      <div className="relative z-10 flex-shrink-0 w-6 flex justify-center">
                        {s.completed ? (
                          <Icons.CheckCircle className="w-5 h-5 text-white" />

                          <div className="w-5 h-5 rounded-full border-2 border-white/30 bg-white/5" />

                          <div className="w-5 h-5 rounded-full border border-white/10 bg-white/[0.03]" />

                      </div>
                      <div className="flex-1 min-w-0 pt-0.5">
                        <p className={`text-sm font-medium ${s.completed ? 'text-white' : s.date ? 'text-white/60' : 'text-white/30'}`}>{s.stage}</p>
                        {s.date ? (
                          <p className="text-xs text-white mt-0.5">{s.date}</p>

    // Safe markdown: React escapes all server content; raw HTML is never injected.
    const Markdown = ({text = ''}) => {
      const inline = value => String(value).split(/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\(https?:\/\/[^\s)]+\))/g).map((part,i) => {
        if (part.startsWith('**')) return <strong key={i}>{part.slice(2,-2)}</strong>;
        if (part.startsWith('`')) return <code key={i}>{part.slice(1,-1)}</code>;
        const link = part.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/);
        return link ? <a key={i} href={link[2]} target="_blank" rel="noopener noreferrer">{link[1]}</a> : part;
      });
      let fenced = false;
      return <div className="ps-markdown">{String(text).split('\n').map((line,i) => {
        if (line.startsWith('```')) { fenced = !fenced; return null; }
        if (fenced) return <pre key={i}>{line}</pre>;
        const heading = line.match(/^(#{1,6})\s+(.+)/);
        if (heading) return <h3 key={i}>{inline(heading[2])}</h3>;
        if (/^\s*[-*_]{3,}\s*$/.test(line)) return <hr key={i}/>;
        if (/^\s*([-*+] |\d+\. )/.test(line)) return <ul key={i}><li>{inline(line.replace(/^\s*([-*+] |\d+\. )/,''))}</li></ul>;
        if (line.startsWith('> ')) return <blockquote key={i}>{inline(line.slice(2))}</blockquote>;
        return line ? <p key={i}>{inline(line)}</p> : <div key={i} className="h-2"/>;
      })}</div>;
    };
    const ResultList = ({title, items}) => <section><h3>{title}</h3>{items?.length ? <ul>{items.map((v,i)=><li key={i}>{String(v)}</li>)}</ul> : <p>None returned.</p>}</section>;
    const ApiResponse = ({msg}) => {

        {msg.content && <Markdown text={msg.content}/>}
        {msg.outputs?.map((output,i)=><ApiResponse key={i} msg={{...output,id:`${msg.id}-${i}`}}/>)}
        {msg.pending && <p role="status">{msg.status || 'Receiving response…'}</p>}
        {msg.pending && msg.action === 'apply' && <progress aria-label="Preparing documents"/>}

          <ResultList title="Strengths" items={r.strengths}/><ResultList title="Gaps" items={r.gaps}/>
          {!!r.deal_breakers?.length && <ResultList title="Deal breakers" items={r.deal_breakers}/>}
          {r.reasoning && <Markdown text={r.reasoning}/>}
        </>}
        {r && msg.action === 'apply' && <>
          <h3>CV</h3><Markdown text={r.cv_markdown || 'No CV returned.'}/>
          <h3>Cover letter</h3><Markdown text={r.cover_letter_markdown || 'No cover letter returned.'}/>
          <ResultList title="Keyword gaps" items={r.keyword_gaps}/>
          <h3>Review notes</h3><Markdown text={r.review_notes || 'No review notes returned.'}/>
        </>}
        {r && msg.action === 'interviewPrep' && <Markdown text={r.markdown || 'No interview preparation returned.'}/>}
      </div>;
    };
    const ApiContext = React.createContext(null);
    const App = () => {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [isSidebarOpen, setSidebarOpen] = useState(false);
      const [isSidebarExpanded, setSidebarExpanded] = useState(false);
      const [selectedItem, setSelectedItem] = useState(null);
      const [feedback, setFeedback] = useState(null);
      const [currentPage, setCurrentPage] = useState('home');
      const [selectedCategory, setSelectedCategory] = useState(null);
      const messagesEndRef = useRef(null);
      const busyRef = useRef(false);
      const sequence = useRef(0);
      const [apiHealth,setApiHealth] = useState('Checking API…');
      useEffect(()=>{
        let active = true;
        window.Profeshare.health().then(h=>{
          if (!h.ok) throw new Error('Health check failed');
          if (active) setApiHealth(`${h.mode} · ${h.live ? 'live' : 'mock'}`);
        }).catch(()=>{ if(active) setApiHealth(`API unreachable at ${window.PROFESHARE_API}`); });
        return ()=>{active=false;};
      },[]);
      const updateReply = (id,patch) => setMessages(prev=>prev.map(m=>m.id===id ? {...m,...(typeof patch==='function'?patch(m):patch)} : m));
      const runRequest = async text => {
        if (busyRef.current || !text.trim()) return;
        busyRef.current=true; setIsGenerating(true); setCurrentPage('results');
        const id = ++sequence.current;
        setMessages(prev=>[...prev,{role:'user',content:text},{role:'ai',id,content:'',pending:true}]);
        try {
          const reply = await window.ProfeshareSession.converse(text, {
            onToken: token => updateReply(id,m=>({content:m.content+token})),
            onStatus: status => updateReply(id,{status}),
            onResult: output => updateReply(id,m=>({outputs:[...(m.outputs || []),output]}))
          });
          updateReply(id,{content:reply.content || ''});
        } catch(e) { updateReply(id,{error:e.message || String(e)}); }
        finally { updateReply(id,{pending:false}); busyRef.current=false; setIsGenerating(false); }
      };

      // Rotating category-specific placeholder for the Home AI Chat input.
      // - Active list locks to a single entry when a category chip is selected.
      // - Rotation pauses on focus or once the user starts typing.
      // - placeholderIndex drives a single span that remounts on change (key=placeholderIndex) to re-run the CSS crossfade.
      const placeholderList = selectedCategory
        ? [PLACEHOLDER_COPY[selectedCategory]]
        : Object.keys(PLACEHOLDER_COPY).map(key => PLACEHOLDER_COPY[key]);
      const [placeholderIndex, setPlaceholderIndex] = useState(0);
      const [isInputFocused, setIsInputFocused] = useState(false);
      const rotationPaused = isInputFocused || input.trim().length > 0;

      useEffect(() => {
        if (rotationPaused || placeholderList.length <= 1) return undefined;
        const id = setInterval(() => {
          setPlaceholderIndex(i => (i + 1) % placeholderList.length);
        }, PLACEHOLDER_ROTATION_MS);
        return () => clearInterval(id);
      }, [rotationPaused, placeholderList.length]);

      // When the locked category changes, snap to its (single) copy without animating.
      useEffect(() => {
        setPlaceholderIndex(0);
      }, [selectedCategory]);

      const scrollToBottom = () => {
        const scrollRegion = messagesEndRef.current?.closest('.overflow-y-auto');
        if (scrollRegion) scrollRegion.scrollTo({ top: scrollRegion.scrollHeight, behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages]);

      const handleSend = () => {
        if (!input.trim() || busyRef.current) return;
        const text = input.trim(); setInput('');
        return runRequest(text);
      };


      const handleFeedbackSubmit = (submittedFeedback) => {
        setFeedback(null);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) {
          e.preventDefault();
          handleSend();
        }
      };

      const handlePromptClick = (text) => {
        setInput(text);
      };

      const handleNavigateToProfile = () => {
        setCurrentPage('profile');
        setSidebarOpen(false);
      };

      return (
          <ApiContext.Provider value={{health:apiHealth}}>
          <div className={`h-screen w-full relative flex overflow-hidden ${['home', 'calendar', 'discover', 'library', 'community', 'profile'].includes(currentPage) ? 'home-sidebar-layout' : ''} ${currentPage === 'calendar' ? 'calendar-page-active' : ''}`}>
          <div className="app-background" aria-hidden="true"></div>
          
          <aside id="primary-sidebar" className={`app-sidebar relative z-30 h-full flex-shrink-0 sidebar-glass flex flex-col transition-[width] duration-200 ease-[cubic-bezier(0.2,0,0,1)] overflow-visible ${isSidebarExpanded ? 'w-72 is-expanded' : 'w-[76px] is-collapsed'}`} data-od-id="persistent-sidebar">
            <div className="p-6 flex items-center justify-between relative">
              <div className={`sidebar-brand flex items-center gap-2 min-w-0 ${isSidebarExpanded ? '' : 'justify-center w-full'}`}>
                <img src="Profeshare-AI-Logo.svg" alt="Profeshare AI" className={`sidebar-logo object-contain ${isSidebarExpanded ? '' : 'hidden'}`} />
              </div>
              <button onClick={() => setSidebarExpanded(value => !value)} className={`sidebar-toggle w-8 h-8 p-0 flex items-center justify-center hover:bg-white/10 rounded-lg transition-colors text-white/70 hover:text-white ${isSidebarExpanded ? '' : 'absolute top-4 left-1/2 -translate-x-1/2'}`} aria-label={isSidebarExpanded ? 'Collapse sidebar' : 'Expand sidebar'} aria-expanded={isSidebarExpanded}>
                {isSidebarExpanded ? <Icons.ChevronLeft className="w-4 h-4" /> : <Icons.ChevronRight className="w-4 h-4" />}
              </button>
            </div>
            
            <div className="px-4">
              <button onClick={() => { if (busyRef.current) return; window.ProfeshareSession.reset(); setMessages([]); setCurrentPage('home'); setSidebarOpen(false); setInput(''); }} className={`w-full py-3 glass glass-card flex items-center gap-3 text-sm font-medium hover:bg-white/10 transition-colors text-white ${isSidebarExpanded ? 'px-4 justify-start' : 'px-3 justify-center'}`} title={isSidebarExpanded ? undefined : 'New Chat'}>
                <Icons.Plus className="w-4 h-4" />
                <span className={`sidebar-label ${isSidebarExpanded ? '' : 'hidden'}`}>New Chat</span>
              </button>
              <button
                type="button"
                onClick={() => { setCurrentPage('calendar'); setSidebarOpen(false); }}
                className={`w-full mt-2 py-3 rounded-xl flex items-center gap-3 text-sm font-medium transition-colors border ${isSidebarExpanded ? 'px-4 justify-start' : 'px-3 justify-center'} ${
                  currentPage === 'calendar'
                    ? 'bg-white/10 border-white/15 text-white'
                    : 'bg-white/[0.025] border-white/[0.08] text-white/70 hover:bg-white/[0.07] hover:text-white'
                }`}
                data-od-id="sidebar-calendar"
                title={isSidebarExpanded ? undefined : 'Calendar'}
              >
                <Icons.Calendar className="w-4 h-4" />
                <span className={`sidebar-label ${isSidebarExpanded ? '' : 'hidden'}`}>Calendar</span>
              </button>
              <button
                type="button"
                onClick={() => { setCurrentPage('discover'); setSidebarOpen(false); }}
                className={`w-full mt-2 py-3 rounded-xl flex items-center gap-3 text-sm font-medium transition-colors border ${isSidebarExpanded ? 'px-4 justify-start' : 'px-3 justify-center'} ${
                  currentPage === 'discover'
                    ? 'bg-white/10 border-white/15 text-white'
                    : 'bg-white/[0.025] border-white/[0.08] text-white/70 hover:bg-white/[0.07] hover:text-white'
                }`}
                data-od-id="sidebar-discover"
                title={isSidebarExpanded ? undefined : 'Discover'}
              >
                <Icons.Compass className="w-4 h-4" />
                <span className={`sidebar-label ${isSidebarExpanded ? '' : 'hidden'}`}>Discover</span>
              </button>
              <button
                type="button"
                onClick={() => { setCurrentPage('library'); setSidebarOpen(false); }}
                className={`w-full mt-2 py-3 rounded-xl flex items-center gap-3 text-sm font-medium transition-colors border ${isSidebarExpanded ? 'px-4 justify-start' : 'px-3 justify-center'} ${
                  currentPage === 'library'
                    ? 'bg-white/10 border-white/15 text-white'
                    : 'bg-white/[0.025] border-white/[0.08] text-white/70 hover:bg-white/[0.07] hover:text-white'
                }`}
                data-od-id="sidebar-library"
                title={isSidebarExpanded ? undefined : 'Library'}
              >
                <Icons.Bookmark className="w-4 h-4" />
                <span className={`sidebar-label ${isSidebarExpanded ? '' : 'hidden'}`}>Library</span>
              </button>
              <button
                type="button"
                onClick={() => { setCurrentPage('community'); setSidebarOpen(false); }}
                className={`w-full mt-2 py-2.5 rounded-xl flex items-center gap-3 text-sm transition-colors border ${isSidebarExpanded ? 'px-4 justify-start' : 'px-3 justify-center'} ${
                  currentPage === 'community'
                    ? 'bg-white/10 border-white/15 text-white'
                    : 'bg-white/[0.018] border-white/[0.06] text-white/60 hover:bg-white/[0.07] hover:text-white'
                }`}
                data-od-id="sidebar-community"
                aria-current={currentPage === 'community' ? 'page' : undefined}
                title={isSidebarExpanded ? undefined : 'Community'}
              >
                <Icons.Users className="w-4 h-4" />
                <span className={`sidebar-label ${isSidebarExpanded ? '' : 'hidden'}`}>Community</span>
              </button>
            </div>

            <div className="flex-1 overflow-y-auto custom-scroll">
              {isSidebarExpanded && (
                <div className="p-4 mt-4" data-od-id="sidebar-recent-chats">
                  <div className="text-xs font-semibold text-white uppercase tracking-wider mb-3 px-2">Recent</div>
                  <div className="space-y-1">
                    {messages.filter(m => m.role === 'user').map((m, i) => (
                      <button key={i} onClick={() => { setCurrentPage('results'); setSidebarOpen(false); }} className="w-full py-2.5 rounded-lg hover:bg-white/5 transition-colors text-sm text-white hover:text-white flex items-center gap-3 truncate text-left px-3 justify-start">
                        <Icons.MessageSquare className="w-4 h-4 flex-shrink-0" />
                        <span className="truncate sidebar-label">{m.content}</span>
                      </button>
                    ))}
                    {messages.length === 0 && (
                      <div className="px-3 py-2 text-sm text-white/30 italic">No recent searches</div>
                    )}
                  </div>
                </div>
              )}
            </div>

            {/* Profile Section at Bottom of Sidebar */}
            <div className={`flex-shrink-0 p-4 border-t border-white/10 ${isSidebarExpanded ? '' : 'px-3'}`}>
              <button
                onClick={handleNavigateToProfile}
                title={isSidebarExpanded ? undefined : 'Your Profile'}
                className={`w-full flex items-center gap-3 p-3 rounded-xl transition-all ${isSidebarExpanded ? 'justify-start' : 'justify-center'} ${
                  currentPage === 'profile'
                    ? 'bg-white/10 border border-white/15'
                    : 'hover:bg-white/5 border border-transparent'
                }`}
              >
                <div className="w-10 h-10 rounded-full bg-white/10 border border-white/15 flex items-center justify-center flex-shrink-0">
                  <span className="font-display text-sm font-bold text-white">SK</span>
                </div>
                <div className={`flex-1 min-w-0 text-left sidebar-label ${isSidebarExpanded ? '' : 'hidden'}`}>
                  <p className="text-sm font-medium text-white">Sam</p>
                  <p className="text-xs text-white truncate">View profile</p>
                </div>
                {isSidebarExpanded && <Icons.ChevronRight className="w-4 h-4 text-white" />}
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <div className="flex-1 flex flex-col h-full relative z-10 transition-all duration-500 main-content-surface">
            {currentPage === 'profile' ? (
              <ProfilePage profile={USER_PROFILE} />
            ) : currentPage === 'calendar' ? (
              <CalendarPage />
            ) : currentPage === 'discover' ? (
              <DiscoverPage />
            ) : currentPage === 'community' ? (
              <CommunityPage />
            ) : currentPage === 'library' ? (
              <LibraryPage />
            ) : messages.length === 0 ? (
              <div className="home-empty-state animate-[fadeIn_0.5s_ease-out]">
                <div className="home-background" aria-hidden="true"></div>
                <div className="home-primary-stack" data-od-id="home-primary-chat">
                  <h1 className="home-greeting font-display text-4xl sm:text-5xl text-white tracking-[-0.04em]">
                    Good afternoon, Samarpan.
                  </h1>
                  
                  <div className="home-chat-wrap relative group">
                    <ChatComposer
                      input={input}
                      setInput={setInput}
                      handleKeyDown={handleKeyDown}
                      handleSend={handleSend}
                      isGenerating={isGenerating}
                      placeholderList={placeholderList}
                      placeholderIndex={placeholderIndex}
                      setIsInputFocused={setIsInputFocused}
                      dataId="home-chat-composer"
                    />
                  </div>

                  <p className="response-follow-up ps-conversation-hint" data-od-id="conversation-guidance">Tell me what you need. Try “Evaluate my fit” or “Prepare my full application.” I’ll ask for your CV and the job posting here.</p>
                </div>

              </div>
            ) : (
              <div className="flex-1 flex flex-col h-full overflow-hidden w-full max-w-5xl mx-auto animate-[fadeIn_0.3s_ease-out]">
                
                <div className="results-message-scroll flex-1 overflow-y-auto custom-scroll p-4 sm:p-6">
                  <div className="flex flex-col gap-8 max-w-5xl mx-auto">
                    {messages.map((msg, idx) => (
                      <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        {msg.role === 'user' ? (
                          <div className="glass glass-card px-6 py-4 max-w-[85%] border-white/20 bg-white/5">
                            <p className="text-white text-[15px] leading-relaxed">{msg.content}</p>
                          </div>
                        ) : (
                          <div className="w-full space-y-6">
                            <div className="flex items-center gap-3 text-white">
                              <div className="w-8 h-8 rounded-full bg-white flex items-center justify-center flex-shrink-0 shadow-[0_0_8px_rgba(255,255,255,0.29)]">
                                <span className="font-display font-bold text-[var(--bg)] text-sm">P</span>
                              </div>
                              <span className="text-sm font-medium">{msg.action === 'evaluate' ? 'Fit evaluation' : msg.action === 'apply' ? 'Application documents' : msg.action === 'interviewPrep' ? 'Interview prep' : 'Profeshare'}</span>
                            </div>

                            <ApiResponse msg={msg} />



                          </div>
                        )}
                      </div>
                    ))}
                    
                    <div ref={messagesEndRef} />
                  </div>
                </div>

                <div className="results-chat-dock">
                  <div className="results-chat-inner">
                    <ChatComposer
                      input={input}
                      setInput={setInput}
                      handleKeyDown={handleKeyDown}
                      handleSend={handleSend}
                      isGenerating={isGenerating}
                      placeholderList={placeholderList}
                      placeholderIndex={placeholderIndex}
                      setIsInputFocused={setIsInputFocused}
                      ariaLabel="Refine or start a new search"
                      dataId="results-chat-composer"
                    />
                  </div>
                </div>
                
              </div>
            )}
          </div>
          
          <DetailModal item={selectedItem} onClose={() => setSelectedItem(null)} />
          <FeedbackModal feedback={feedback} onClose={() => setFeedback(null)} onSubmit={handleFeedbackSubmit} />
          
        </div>
        </ApiContext.Provider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
