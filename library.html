    function renderThemes(){const list=document.getElementById('themeList');list.innerHTML=themes.map(t=>`<div><button class="theme-row ${state.theme===t.id?'is-active':''}" aria-expanded="${!!state.expandedThemes[t.id]}" onclick="selectTheme('${t.id}')" oncontextmenu="themeMenu(event,'${t.id}')"><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg><span>${t.name}</span><span class="theme-count">${t.count}</span></button>${t.children.length?`<div class="subthemes ${state.expandedThemes[t.id]?'is-open':''}">${t.children.map(c=>`<div><button class="subtheme ${state.theme===c.id?'is-active':''}" onclick="selectTheme('${c.id}')">${c.name}<span style="float:right;color:var(--muted-2);font-size:11px">${c.count}</span></button>${c.children?.length?`<div style="padding-left:12px">${c.children.map(s=>`<button class="subtheme ${state.theme===s.id?'is-active':''}" onclick="selectTheme('${s.id}')">${s.name}<span style="float:right;color:var(--muted-2);font-size:11px">${s.count}</span></button>`).join('')}</div>`:''}</div>`).join('')}</div>`:''}</div>`).join('');}
    function selectTheme(id){state.theme=id;state.expandedThemes[id]=!state.expandedThemes[id]||id==='all';renderThemes();render();}
    function themeMenu(e,id){e.preventDefault();const t=themes.find(x=>x.id===id);const action=prompt(`Theme “${t.name}”: type rename, delete, or cancel`,'cancel');if(action==='rename'){const next=prompt('New theme name',t.name);if(next)t.name=next}if(action==='delete'&&id!=='all'){themes.splice(themes.findIndex(x=>x.id===id),1);state.theme='all'}renderThemes();render()}
    function addTheme(){const name=prompt('Name your new theme');if(name){themes.push({id:'theme-'+Date.now(),name,count:0,children:[]});renderThemes()}}
    function renderTabs(){}
    function setTab(tab){state.tab=tab;renderTabs();const toolbar=document.querySelector('.toolbar');toolbar.classList.toggle('is-community',tab==='Community');const input=document.getElementById('listSearch');input.placeholder=tab==='Community'?'Search messages and channels':'Search this view';render()}
    function currentCommunityChannel(){if(communityState.channel.startsWith('dm-')){const person=communityPeople.find(p=>`dm-${p.id}`===communityState.channel)||communityPeople[0];return {id:communityState.channel,label:person.name,private:true,unread:0,description:`Direct message · ${person.status}`}}return communityChannels.find(c=>c.id===communityState.channel)||communityChannels[0]}
    function setCommunityChannel(id){communityState.channel=id;communityState.memberOpen=false;communityState.subtab='Messages';render()}
    function openCommunityDM(id){setCommunityChannel(`dm-${id}`)}
    function setCommunitySubtab(tab){communityState.subtab=tab;render()}
    function toggleCommunityMembers(){communityState.memberOpen=!communityState.memberOpen;render()}
    function sendCommunityMessage(){const input=document.getElementById('communityComposerInput');const text=input&&input.value.trim();if(!text)return;communityMessages.push({id:Date.now(),channel:communityState.channel,person:'Sam',initials:'S',avatar:'avatar-blue',time:'Now',text:text.replaceAll('<','&lt;').replaceAll('>','&gt;'),mentions:[],replies:0,reaction:''});render()}
    function renderCommunity(){const root=document.getElementById('sourceList');const query=(document.getElementById('listSearch').value||document.getElementById('globalSearch').value||'').toLowerCase();const channel=currentCommunityChannel();const messages=communityMessages.filter(m=>m.channel===channel.id&&(!query||`${m.person} ${m.text}`.toLowerCase().includes(query)));const visiblePeople=communityPeople.filter(p=>!query||`${p.name} ${p.preview}`.toLowerCase().includes(query));root.className='community-view';root.innerHTML=`<aside class="community-sidebar" data-od-id="community-conversation-rail"><div class="community-workspace"><span class="community-workspace-mark">P</span><span>Profeshare community</span><button aria-label="Community options">⌄</button></div><input id="communitySearch" class="community-search" aria-label="Search community" placeholder="Find a conversation…" value="${query.replaceAll('"','&quot;')}" oninput="document.getElementById('listSearch').value=this.value;render()"><div class="community-nav"><button onclick="setCommunitySubtab('Threads')">◌ <span>Threads</span></button><button onclick="setCommunitySubtab('Huddles')">◉ <span>Huddles</span></button><button onclick="setCommunitySubtab('Drafts & sent')">✎ <span>Drafts & sent</span></button></div><div class="community-section-label"><span>Public groups</span><button aria-label="Add public group" onclick="quickAction('Create a public community group')">+</button></div><div>${communityChannels.filter(c=>!c.private).map(c=>`<button class="community-channel ${communityState.channel===c.id?'is-active':''}" onclick="setCommunityChannel('${c.id}')"><span class="channel-icon">#</span><span>${c.label}</span>${c.unread?`<span class="channel-badge">${c.unread}</span>`:''}</button>`).join('')}</div><div class="community-section-label"><span>Private groups</span><button aria-label="Add private group" onclick="quickAction('Create a private community group')">+</button></div><div>${communityChannels.filter(c=>c.private).map(c=>`<button class="community-channel ${communityState.channel===c.id?'is-active':''}" onclick="setCommunityChannel('${c.id}')"><span class="channel-icon">⌑</span><span>${c.label}</span>${c.unread?`<span class="channel-badge">${c.unread}</span>`:''}</button>`).join('')}</div><div class="community-section-label"><span>Direct messages</span><button aria-label="Start direct message" onclick="quickAction('Start a direct message')">+</button></div><div class="community-dm-list">${visiblePeople.map(p=>`<button class="community-person ${communityState.channel===`dm-${p.id}`?'is-active':''}" onclick="openCommunityDM('${p.id}')"><span class="community-avatar small ${p.avatar}">${p.initials}</span><span>${p.name}</span><span class="community-person-status" style="background:${p.status==='online'?'var(--success)':p.status==='away'?'var(--warning)':'var(--muted-2)'}"></span></button>`).join('')||'<div class="community-empty"><div><strong>No conversations found</strong><span>Try another name or channel.</span></div></div>'}</div></aside><section class="community-main" data-od-id="community-channel"><header class="community-channel-head"><span class="community-avatar ${channel.private?'avatar-violet':'avatar-blue'}">${channel.private?'⌑':'#'}</span><div class="community-channel-title"><h2>${channel.label}</h2><p>${channel.description}</p></div><div class="community-channel-actions"><button class="community-member-button" onclick="toggleCommunityMembers()">♧ ${communityPeople.length+3}</button><button class="community-icon-button" aria-label="Start huddle" onclick="quickAction('Start a huddle in ${channel.label}')">◉</button><button class="community-icon-button" aria-label="Search channel" onclick="document.getElementById('listSearch').focus()">⌕</button><button class="community-icon-button" aria-label="More channel actions">•••</button></div>${communityState.memberOpen?`<div class="community-members"><strong>Members · ${communityPeople.length+3}</strong>${communityPeople.slice(0,4).map(p=>`<div class="community-member-row"><span class="community-avatar small ${p.avatar}">${p.initials}</span><span>${p.name}</span><span>${p.status}</span></div>`).join('')}</div>`:''}</header><nav class="community-subnav" aria-label="Community channel sections">${['Messages','Add canvas','Files & links','Pins'].map(t=>`<button class="${communityState.subtab===t?'is-active':''}" onclick="setCommunitySubtab('${t}')">${t}</button>`).join('')}</nav>${communityState.subtab==='Messages'?`<div class="community-messages">${messages.length?`<div class="community-date"><span>Today</span></div>${messages.map(m=>`<article class="community-message"><span class="community-avatar ${m.avatar}">${m.initials}</span><div class="community-message-body"><div class="community-message-meta"><strong>${m.person}</strong><time>${m.time}</time></div><p>${m.text}</p><div class="community-message-tools">${m.reaction?`<button class="community-reaction" onclick="quickAction('React to ${m.person}\'s message')">${m.reaction}</button>`:''}${m.replies?`<button class="community-thread-link" onclick="quickAction('Open ${m.replies} replies from ${m.person}')">${m.replies} ${m.replies===1?'reply':'replies'} · View thread</button>`:''}</div></div></article>`).join('')}`:'<div class="community-empty"><div><strong>No messages match this search</strong><span>Start the conversation with the composer below.</span></div></div>'}</div><div class="community-composer" data-od-id="community-composer"><div class="community-composer-tools"><button aria-label="Bold"><strong>B</strong></button><button aria-label="Italic"><em>I</em></button><button aria-label="Add link">↗</button><button aria-label="Mention">@</button><button aria-label="Add emoji">☺</button></div><textarea id="communityComposerInput" rows="2" placeholder="Message ${channel.private?'':'#'}${channel.label}" oninput="document.getElementById('communitySend').classList.toggle('is-ready',!!this.value.trim())" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendCommunityMessage()}"></textarea><div class="community-composer-bottom"><span>Press Enter to send · Shift + Enter for a new line</span><button id="communitySend" class="community-send" aria-label="Send message" onclick="sendCommunityMessage()">➤</button></div></div>`:`<div class="community-empty"><div><strong>${communityState.subtab}</strong><span>Shared ${communityState.subtab.toLowerCase()} for ${channel.label} will appear here.</span></div></div>`}</section>`}
    function filteredSources(){const q=(document.getElementById('listSearch').value||document.getElementById('globalSearch')?.value||'').toLowerCase();const type=document.getElementById('typeFilter').value,status=document.getElementById('statusFilter').value;let rows=sources.filter(s=>(state.theme==='all'||s.themes.includes(state.theme))&&(!q||`${s.title} ${s.author} ${s.summary}`.toLowerCase().includes(q))&&(type==='all'||s.type===type)&&(status==='all'||s.status===status));const sort=document.getElementById('sortSelect').value;if(sort==='alpha')rows.sort((a,b)=>a.title.localeCompare(b.title));if(sort==='status')rows.sort((a,b)=>a.status.localeCompare(b.status));return rows}
    function render(){const root=document.getElementById('sourceList');if(state.tab!=='Sources'){const data=state.tab==='Notes'?notes:state.tab==='Annotations'?annotations:chats;root.innerHTML=data.length?data.map(item=>state.tab==='Notes'?`<article class="source-row"><div class="source-type article">✎</div><div class="source-main"><span class="source-title">${item.title}</span><div class="source-meta"><span>${item.preview}</span><span>· ${item.source}</span><span>· ${item.time}</span></div></div><span class="status">${item.tags.join(' · ')}</span><button class="row-menu" aria-label="More options">•••</button></article>`:state.tab==='Annotations'?`<article class="source-row"><div class="source-type">❝</div><div class="source-main"><span class="source-title">${item.excerpt}</span><div class="source-meta"><span>${item.comment}</span><span>· ${item.source}</span><span>· ${item.time}</span></div></div><span class="status">Open</span><button class="row-menu" aria-label="More options">•••</button></article>`:`<article class="source-row" onclick="quickAction('${item.title.replaceAll("'","\\'")}')"><div class="source-type video">◌</div><div class="source-main"><span class="source-title">${item.title}</span><div class="source-meta"><span>${item.snippet}</span><span>· ${item.attached} sources</span><span>· ${item.time}</span></div></div><span class="status reading">Resume</span><button class="row-menu" aria-label="More options">•••</button></article>`).join(''):'<div class="empty-state"><div><strong>No items here yet</strong><span>Save research or create a note to build this view.</span></div></div>';return}const rows=filteredSources();root.innerHTML=rows.length?rows.map(s=>`<article class="source-row ${state.openId===s.id?'is-selected':''}" data-od-id="library-source-${s.id}" onclick="openSource(${s.id})"><input type="checkbox" aria-label="Select ${s.title}" onclick="event.stopPropagation()"><div class="source-type ${s.type}">${formatSource(s.type)}</div><div class="source-main"><span class="source-title" title="${s.title}">${s.title}</span><div class="source-meta"><span>${s.author}</span><span>· ${s.date}</span><span>· ${formatSource(s.type)}</span></div></div><span class="status ${s.status.toLowerCase()}">${s.status}</span><button class="row-menu" aria-label="More options" onclick="event.stopPropagation();sourceMenu(${s.id})">•••</button></article>`).join(''):'<div class="empty-state"><div><strong>No matching sources</strong><span>Try another theme, type, or search term.</span></div></div>';updateAI()}
    function openSource(id){state.openId=id;const source=sources.find(s=>s.id===id);if(!source)return;if(source.status==='Unread')source.status='Reading';if(!state.context.includes(source.title))state.context=[source.title];if(id===1){openDocument(id);return}render();updateAI()}
    function openDocument(id){const source=sources.find(s=>s.id===id);const panel=document.querySelector('.content-panel');const viewer=document.getElementById('documentView');if(!source||!panel||!viewer)return;state.openId=id;state.documentZoom=1;state.documentHighlighted=false;viewer.hidden=false;viewer.classList.add('is-open');panel.classList.add('is-document-open');viewer.innerHTML=`<header class="document-view-head"><button class="document-back" data-od-id="library-document-back" aria-label="Back to Library" onclick="closeDocument()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg><span>Back</span></button><div class="document-heading"><span class="document-badge">PDF</span><strong title="${source.title}">${source.title}</strong></div><div class="document-tools" aria-label="Document tools"><button class="document-tool" id="documentHighlight" data-od-id="library-document-highlight" aria-label="Highlight document" aria-pressed="false" title="Highlight document" onclick="toggleDocumentHighlight()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 15 9-9 6 6-9 9H4v-6Z"/><path d="m13 6 2-2 6 6-2 2M7 20h13"/></svg></button><button class="document-tool" data-od-id="library-document-zoom-out" aria-label="Zoom out" title="Zoom out" onclick="changeDocumentZoom(-.1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button><span id="documentZoom" class="document-zoom" aria-live="polite">100%</span><button class="document-tool" data-od-id="library-document-zoom-in" aria-label="Zoom in" title="Zoom in" onclick="changeDocumentZoom(.1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button></div></header><div id="documentViewPort" class="document-view-port"><article id="documentPaper" class="document-paper"><div class="document-page-intro"><span>Page view · scroll to read</span><h2>${source.title}</h2><p>Extracted text from the attached PDF, presented as a plain white reading page inside Library.</p></div><div class="document-page-frame"><div class="document-highlight-layer" aria-hidden="true"></div><pre id="documentText" class="document-text is-loading" aria-label="Extracted PDF text">Loading document text…</pre></div></article></div>`;loadDocumentText();updateAI()}
    async function loadDocumentText(){const output=document.getElementById('documentText');if(!output)return;try{const response=await fetch('ProtoAI--Model-Informed-Prototyping-for-AI-Powered-Interfaces.txt');if(!response.ok)throw new Error('Document text unavailable');output.textContent=await response.text();output.classList.remove('is-loading')}catch(error){output.textContent='The extracted document text could not be loaded in this preview.';output.classList.remove('is-loading')}}
    function closeDocument(){const panel=document.querySelector('.content-panel');const viewer=document.getElementById('documentView');if(!panel||!viewer)return;panel.classList.remove('is-document-open');viewer.classList.remove('is-open');viewer.hidden=true;viewer.innerHTML='';render()}
    function changeDocumentZoom(delta){state.documentZoom=Math.min(1.4,Math.max(.8,Number((state.documentZoom+delta).toFixed(1))));const paper=document.getElementById('documentPaper');const readout=document.getElementById('documentZoom');if(!paper||!readout)return;paper.style.transform=`scale(${state.documentZoom})`;paper.style.width=`${100/state.documentZoom}%`;readout.textContent=`${Math.round(state.documentZoom*100)}%`}
    function toggleDocumentHighlight(){state.documentHighlighted=!state.documentHighlighted;document.getElementById('documentPaper')?.classList.toggle('is-highlighted',state.documentHighlighted);const button=document.getElementById('documentHighlight');if(button){button.classList.toggle('is-active',state.documentHighlighted);button.setAttribute('aria-pressed',String(state.documentHighlighted))}}
    function sourceMenu(id){const s=sources.find(x=>x.id===id);const action=prompt(`“${s.title}”: type rename, tag, delete, or cancel`,'cancel');if(action==='rename'){const n=prompt('New title',s.title);if(n)s.title=n}if(action==='delete')sources=sources.filter(x=>x.id!==id);render()}
    function updateAI(){if(state.tab==='Community'){const channel=currentCommunityChannel();const isDM=communityState.channel.startsWith('dm-');const questions=[`Summarize the latest decisions in ${isDM?'this conversation':'#'+channel.label}.`,`Turn this conversation into a short project update.`];document.getElementById('suggestions').innerHTML=questions.map(q=>`<button class="suggestion" onclick="quickAction('${q.replaceAll("'","\\'")}')">${q}</button>`).join('');document.getElementById('contextRow').innerHTML=`<span class="context-chip">${isDM?'DM ':'#'}${channel.label}</span>`;return}const source=sources.find(s=>s.id===state.openId)||sources[0];const questions=[`What are the strongest claims in “${source.title}”?`,`How does this source connect to user control and trust?`];document.getElementById('suggestions').innerHTML=questions.map(q=>`<button class="suggestion" onclick="quickAction('${q.replaceAll("'","\\'")}')">${q}</button>`).join('');document.getElementById('contextRow').innerHTML=state.context.map((c,i)=>`<span class="context-chip">${c}<button aria-label="Remove ${c}" onclick="removeContext(${i})">×</button></span>`).join('')}
    function quickAction(text){document.getElementById('chatInput').value=text;updateComposer();document.getElementById('chatInput').focus()}
    function updateComposer(){const ready=document.getElementById('chatInput').value.trim();document.getElementById('sendBtn').classList.toggle('is-ready',!!ready)}
    function sendChat(){const input=document.getElementById('chatInput');if(!input.value.trim())return;input.value='';input.placeholder='Ask another question…';updateComposer()}
    function addContext(label){if(!state.context.includes(label))state.context.push(label);document.getElementById('mentionPicker').classList.add('hidden');updateAI()}
    function removeContext(i){state.context.splice(i,1);updateAI()}
    function newChat(){state.context=[];document.getElementById('chatInput').value='';updateAI();updateComposer()}
    function toggleAI(){state.aiCollapsed=!state.aiCollapsed;document.getElementById('aiPanel').classList.toggle('is-collapsed',state.aiCollapsed)}
    function toggleMobileAI(){document.getElementById('aiPanel').classList.toggle('is-mobile-open')}
    function addSource(){document.getElementById('fileInput').click()}
    function handleUpload(input){if(input.files[0]){const file=input.files[0],extension=file.name.split('.').pop().toLowerCase(),type=extension==='pdf'?'pdf':['doc','docx'].includes(extension)?'docs':['ppt','pptx'].includes(extension)?'ppt':'article';sources.unshift({id:Date.now(),type,title:file.name,author:'Uploaded by Sam',date:'Just now',status:'Unread',themes:[],summary:'A newly added source ready for review. Open it to start a focused conversation with Profeshare AI.'});tabData.Sources=sources.length;renderTabs();render()}}
    function openDetail(kind,item){
      const detail=document.getElementById('detailView');
      const title=kind==='source'?item.title:kind==='note'?item.title:kind==='annotation'?item.source:item.title;
      const meta=kind==='source'?`${item.author} · ${item.date} · ${item.status}`:kind==='note'?`${item.source} · ${item.time}`:kind==='annotation'?`${item.time} · ${item.source}`:`${item.attached} saved sources · ${item.time}`;
      const body=kind==='source'?`<p>${item.summary}</p><p>This source is saved in your Library for comparison with related work. Use the AI panel to break down the argument, identify evidence, or turn it into a study guide.</p>`:kind==='note'?`<p>${item.preview}</p><p>This note is linked to <strong>${item.source}</strong>. Revisit it alongside the original source whenever you need to verify the idea or expand the research trail.</p>`:kind==='annotation'?`<p><em>“${item.excerpt}”</em></p><p>${item.comment}</p><p>This annotation is anchored to <strong>${item.source}</strong> so the context stays attached to the original document, video, or meeting recording.</p>`:`<p>${item.snippet}</p><p>This saved conversation keeps its source context and can be resumed with Profeshare AI at any time.</p>`;
      detail.innerHTML=`<button class="detail-back" onclick="closeDetail()">← Back to Library</button><div class="detail-context">${kind==='source'?'Saved source':kind==='note'?'Library note':kind==='annotation'?'Annotation context':'Saved chat'}</div><h2>${title}</h2><div class="detail-meta">${meta}</div><div class="detail-body">${body}</div><div class="detail-actions"><button class="detail-action" onclick="quickAction('Summarize this ${kind}')">Ask Profeshare AI</button><button class="detail-action" onclick="closeDetail()">Close</button></div>`;
      detail.classList.add('is-open');
    }
    function closeDetail(){document.getElementById('detailView').classList.remove('is-open')}
    function formatSource(type){return type==='pdf'?'PDF':type==='docs'?'DOCS':type==='ppt'?'PPT':'ARTICLE'}
    function render(){
      const root=document.getElementById('sourceList');
      const query=(document.getElementById('listSearch').value||document.getElementById('globalSearch')?.value||'').toLowerCase();
      if(state.tab==='Community'){renderCommunity();updateAI();return}
      if(state.tab==='Sources'){
        const type=document.getElementById('typeFilter').value,status=document.getElementById('statusFilter').value;
        let rows=sources.filter(s=>(!query||`${s.title} ${s.author} ${s.summary}`.toLowerCase().includes(query))&&(type==='all'||s.type===type)&&(status==='all'||s.status===status));
        const sort=document.getElementById('sortSelect').value;if(sort==='alpha')rows.sort((a,b)=>a.title.localeCompare(b.title));if(sort==='status')rows.sort((a,b)=>a.status.localeCompare(b.status));
        root.className='source-list';root.innerHTML=rows.length?rows.map(s=>{const progress=s.status==='Read'?100:s.status==='Reading'?62:28;return `<article class="source-row ${state.openId===s.id?'is-selected':''}" onclick="openSource(${s.id})"><div class="source-type ${s.type}">${formatSource(s.type)}</div><div class="source-main"><span class="source-title" title="${s.title}">${s.title}</span><div class="source-meta"><span>${s.author}</span><span>· ${s.date}</span><span>· ${formatSource(s.type)}</span></div></div><div class="source-progress ${s.status.toLowerCase()}" aria-label="${s.status}, ${progress}% complete"><span class="source-progress-track"><span class="source-progress-fill"></span></span><span class="source-progress-value">${progress}%</span></div></article>`}).join(''):'<div class="empty-state"><div><strong>No matching sources</strong><span>Try another search or format filter.</span></div></div>';
      } else {
        const data=state.tab==='Notes'?notes:state.tab==='Annotations'?annotations:chats;
        const filtered=data.filter(item=>!query||JSON.stringify(item).toLowerCase().includes(query));
        root.className='view-grid';
        if(state.tab==='Notes')root.innerHTML=filtered.map(n=>`<article class="library-card" onclick='openDetail("note",${JSON.stringify(n)})'><span class="card-arrow">↗</span><div class="card-kicker">Note</div><h3>${n.title}</h3><p>${n.preview}</p><div class="card-footer"><span>${n.time}</span><span class="tag">${n.source}</span></div></article>`).join('')+`<article class="library-card empty-card" onclick="quickAction('Create a new Library note')"><div><strong>+ New note</strong><span>Capture an idea from your research</span></div></article>`;
        if(state.tab==='Annotations')root.innerHTML=filtered.map(a=>`<article class="library-card" onclick='openDetail("annotation",${JSON.stringify(a)})'><span class="card-arrow">↗</span><div class="card-kicker">${a.context}</div><h3>${a.excerpt}</h3><p>${a.comment}</p><div class="card-footer"><span>${a.time}</span><span class="tag">${a.source}</span></div></article>`).join('')+`<article class="library-card empty-card" onclick="quickAction('Add an annotation to a saved source')"><div><strong>+ New annotation</strong><span>Attach a thought to a source</span></div></article>`;
        if(state.tab==='Chats')root.innerHTML=filtered.map(c=>`<article class="library-card" onclick='openDetail("chat",${JSON.stringify(c)})'><span class="card-arrow">↗</span><div class="card-kicker">${c.people}</div><h3>${c.title}</h3><p>${c.snippet}</p><div class="card-footer"><span>${c.time}</span><span class="tag">${c.attached} saved sources</span></div></article>`).join('')+`<article class="library-card empty-card" onclick="newChat()"><div><strong>+ Save a chat</strong><span>Pin a useful conversation here</span></div></article>`;
      }
      updateAI();
    }
    const typeFilter=document.getElementById('typeFilter');typeFilter.innerHTML='<option value="all">All formats</option><option value="pdf">PDF</option><option value="docs">Docs</option><option value="ppt">PPT Slides</option>';typeFilter.onchange=render;
    state.tab='Sources';document.getElementById('listSearch').placeholder='Search files';render();updateAI();
  </script>
